name: effiwaste-ai-chef

services:
  app:
    build:
      context: .
      target: runner
    image: ${APP_IMAGE:-effiwaste-ai-chef:local}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Define OPENAI_API_KEY in .env}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      OPENAI_ORGANIZATION_ID: ${OPENAI_ORGANIZATION_ID:-}
      OPENAI_PROJECT_ID: ${OPENAI_PROJECT_ID:-}
    ports:
      - "127.0.0.1:${APP_PORT:-3100}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
