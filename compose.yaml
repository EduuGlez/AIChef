name: effiwaste-ai-chef

services:
  app:
    build:
      context: .
      target: runner
    image: ${APP_IMAGE:-effiwaste-ai-chef:local}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_TRUSTED_HOSTS: ollama
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    ports:
      - "127.0.0.1:${APP_PORT:-3100}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    networks:
      - ai-backend

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    volumes:
      - ollama-data:/root/.ollama
    expose:
      - "11434"
    networks:
      - ai-backend

  ollama-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do sleep 2; done
        ollama pull "$${OLLAMA_MODEL}"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    depends_on:
      - ollama
    networks:
      - ai-backend

networks:
  ai-backend:

volumes:
  ollama-data:
